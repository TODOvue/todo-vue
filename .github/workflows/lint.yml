name: Quality TODOvue

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  deploy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild SQLite for Linux
        run: pnpm rebuild better-sqlite3

      - name: Create CI .env file
        run: |
          touch .env
          echo NUXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder >> .env
          echo NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com >> .env
          echo NUXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder >> .env
          echo NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder.appspot.com >> .env
          echo NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=1234567890 >> .env
          echo NUXT_PUBLIC_FIREBASE_APP_ID=1:1234567890:web:placeholder >> .env
          echo NUXT_PUBLIC_FIREBASE_DATABASE_URL=https://ci-placeholder.firebaseio.com >> .env
          echo NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-PLACEHOLDER >> .env
          echo NUXT_PUBLIC_SITE_URL=https://ci.todovue.local >> .env
          echo NUXT_PUBLIC_SITE_NAME=TODOvue CI >> .env
          echo NUXT_PUBLIC_SITE_DESCRIPTION=CI deploy validation >> .env
          echo NUXT_PUBLIC_SITE_ENV=ci >> .env
          echo NUXT_PUBLIC_SITE_INDEXABLE=false >> .env
          echo NUXT_PUBLIC_SITE_DEFAULT_LOCALE=es >> .env
          echo NUXT_PUBLIC_SITE_TRAILING_SLASH=true >> .env
          echo NUXT_PUBLIC_VERSION_APP=ci >> .env

      - name: Validate static generate
        run: pnpm run generate
